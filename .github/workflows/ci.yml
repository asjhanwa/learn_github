name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy bandit build

    - name: Install package in development mode
      run: |
        pip install -e .

    - name: Run linting with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 llm_evaluator/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 llm_evaluator/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run code formatting check with black
      run: |
        black --check --diff llm_evaluator/ || echo "Code formatting issues found - run 'black llm_evaluator/' to fix"

    - name: Run type checking with mypy
      run: |
        mypy llm_evaluator/ --ignore-missing-imports || echo "Type checking issues found"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=llm_evaluator --cov-report=xml --cov-report=term-missing

    - name: Generate coverage report
      run: |
        coverage report --show-missing
        COVERAGE=$(coverage report --format=total)
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        echo "Current coverage: $COVERAGE%"

    - name: Check coverage threshold
      run: |
        # Check if coverage is at least 95%
        # Note: Current coverage is ~46%, so this may fail until improved
        if [ "$COVERAGE" -ge 95 ]; then
          echo "✅ Coverage ($COVERAGE%) meets the 95% threshold"
        else
          echo "⚠️  Coverage ($COVERAGE%) is below 95% threshold - improvement needed"
          echo "Current coverage: $COVERAGE%"
          echo "Target coverage: 95%"
          # For now, don't fail the build but warn about coverage
          # Uncomment the next line to enforce the coverage requirement:
          # exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run security scan
      run: |
        bandit -r llm_evaluator/ -f json -o bandit-report.json || echo "Security scan completed with issues"
        
    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results-${{ matrix.python-version }}
        path: bandit-report.json

  build-and-publish:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        # Try using the modern build tool first, fallback to setuptools
        python -m build --sdist --wheel --outdir dist/ || python setup.py sdist bdist_wheel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to Test PyPI
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: true

  coverage-report:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Install package in development mode
      run: |
        pip install -e .

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=llm_evaluator --cov-report=html --cov-report=term

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-report
        path: htmlcov/